<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-perf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="grad-perf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="glow-perf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="104" fill="url(#bg-perf)" />
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#27272A" stroke-width="2" />

  <!-- Angular Gaming Carbon Lines -->
  <path d="M 0 128 L 512 384" stroke="#1C1917" stroke-width="2" />
  <path d="M 0 384 L 512 128" stroke="#1C1917" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#grad-perf)" opacity="0.18" filter="url(#glow-perf)" />

  <!-- Ultra-sharp Geometric Z (Aeronautic / Cyber) -->
  <g transform="translate(256, 256)" filter="url(#glow-perf)">
    <!-- Barra Superior Angulada -->
    <polygon points="-140,-125 120,-125 150,-80 -10,-80 -140,-125" fill="url(#grad-perf)" />
    
    <!-- Diagonal Cortada com Vértices Agressivos -->
    <polygon points="145,-65 40,55 -95,125 -45,125 80,15 155,-40" fill="url(#grad-perf)" />

    <!-- Barra Inferior Angulada -->
    <polygon points="-120,125 140,125 10,80 -150,80 -120,125" fill="url(#grad-perf)" />

    <!-- Acentos de Velocidade em Âmbar -->
    <polygon points="135,-125 160,-100 145,-80 120,-105" fill="url(#amber-accent)" />
    <polygon points="-135,125 -160,100 -145,80 -120,105" fill="url(#amber-accent)" />

    <!-- Tag PERFORMANCE -->
    <rect x="-85" y="-18" width="170" height="36" rx="4" fill="#0A0A0A" stroke="#EF4444" stroke-width="2" />
    <text x="0" y="6" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#F87171" text-anchor="middle" letter-spacing="3">PERFORMANCE</text>
  </g>
</svg>
