<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-horiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-horiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow-h" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="240" rx="32" fill="url(#bg-horiz)" />
  <rect width="798" height="238" x="1" y="1" rx="31" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Logo Mark Left (Centered at x=140, y=120) -->
  <g transform="translate(140, 120) scale(0.65)" filter="url(#glow-h)">
    <circle cx="0" cy="0" r="130" fill="url(#grad-horiz)" opacity="0.15" />
    <path d="M -130 -120 L 110 -120 L 130 -80 L -30 -80 L -130 -120 Z" fill="url(#grad-horiz)" />
    <polygon points="125,-70 50,45 -85,120 -40,120 75,25 140,-50" fill="url(#grad-horiz)" />
    <path d="M -110 120 L 130 120 L 110 80 L -50 80 L -110 120 Z" fill="url(#grad-horiz)" />
    <polygon points="130,-120 155,-95 130,-70 105,-95" fill="#06B6D4" />
    <polygon points="-130,120 -155,95 -130,70 -105,95" fill="#3B82F6" />
  </g>

  <!-- Typography Right -->
  <text x="250" y="125" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="900" fill="#F8FAFC" letter-spacing="-1">
    BigZ <tspan fill="url(#grad-horiz)">OS</tspan>
  </text>
  <text x="254" y="162" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="4">
    LIVRE • CUSTOMIZÁVEL • SEGURO
  </text>
  
  <!-- Badges / Edições -->
  <g transform="translate(254, 182)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="30" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">DEV</text>

    <rect x="70" y="0" width="85" height="22" rx="4" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1" />
    <text x="112" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">BALANCED</text>

    <rect x="165" y="0" width="115" height="22" rx="4" fill="#450A0A" stroke="#EF4444" stroke-width="1" />
    <text x="222" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">PERFORMANCE</text>
  </g>
</svg>
