<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="grad-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow-dev" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="104" fill="url(#bg-dev)" />
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Grid Pattern (Dev aesthetic) -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.35">
    <line x1="96" y1="0" x2="96" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="416" y1="0" x2="416" y2="512" />
    <line x1="0" y1="96" x2="512" y2="96" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="416" x2="512" y2="416" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="130" fill="url(#grad-dev)" opacity="0.12" filter="url(#glow-dev)" />

  <!-- Símbolo Z Estilizado com cortes de código -->
  <g transform="translate(256, 256)" filter="url(#glow-dev)">
    <!-- Barra Superior -->
    <path d="M -130 -120 L 110 -120 L 130 -80 L -30 -80 L -130 -120 Z" fill="url(#grad-dev)" />
    <!-- Diagonal -->
    <polygon points="125,-70 50,45 -85,120 -40,120 75,25 140,-50" fill="url(#grad-dev)" />
    <!-- Barra Inferior -->
    <path d="M -110 120 L 130 120 L 110 80 L -50 80 L -110 120 Z" fill="url(#grad-dev)" />

    <!-- Terminal Prompt Glyphs (Prompt `>_` integrado) -->
    <path d="M -155 -25 L -135 -5 L -155 15" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-125" y1="15" x2="-105" y2="15" stroke="#06B6D4" stroke-width="8" stroke-linecap="round" />

    <!-- Tag DEV -->
    <rect x="70" y="-35" width="85" height="34" rx="6" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="112" y="-13" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" font-weight="900" fill="#10B981" text-anchor="middle">DEV</text>
  </g>
</svg>
