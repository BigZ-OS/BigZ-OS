<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-bal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="mint-bal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow-bal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="104" fill="url(#bg-bal)" />
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#334155" stroke-width="2" opacity="0.5" />

  <!-- Harmonic Rings (Balanced Harmony) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="url(#grad-bal)" opacity="0.12" filter="url(#glow-bal)" />

  <!-- Símbolo Z Equilibrado e Fluido -->
  <g transform="translate(256, 256)" filter="url(#glow-bal)">
    <!-- Barra Superior -->
    <path d="M -120 -115 C -120 -115, 100 -115, 110 -115 C 120 -115, 130 -105, 125 -90 L 105 -75 C 100 -70, 90 -70, -20 -70 L -120 -115 Z" fill="url(#grad-bal)" />
    <!-- Diagonal Fluida -->
    <polygon points="120,-65 45,45 -85,115 -40,115 70,20 135,-45" fill="url(#grad-bal)" />
    <!-- Barra Inferior -->
    <path d="M -110 115 C -120 115, -130 105, -125 90 L -105 75 C -100 70, -90 70, 20 70 L 120 115 Z" fill="url(#grad-bal)" />

    <!-- Acentos Zen / Harmonia -->
    <circle cx="130" cy="-100" r="10" fill="url(#mint-bal)" />
    <circle cx="-130" cy="100" r="10" fill="url(#mint-bal)" />

    <!-- Tag BALANCED -->
    <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="2">BALANCED</text>
  </g>
</svg>
