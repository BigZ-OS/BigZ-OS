<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" />
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="url(#primary-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- BigZ Geometric Emblem (Hexagonal / Z Shield) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Top Horizontal & Corner Slice -->
    <path d="M -130 -120 L 110 -120 L 130 -80 L -30 -80 L -130 -120 Z" fill="url(#primary-grad)" />

    <!-- Dynamic Diagonal Core -->
    <path d="M 120 -80 L 140 -40 L -60 120 L -120 120 L 80 -40 L 40 -40 L -40 40 L 40 -80 Z" fill="url(#primary-grad)" />
    
    <!-- Bold Sharp Diagonal Segment -->
    <polygon points="125,-70 50,45 -85,120 -40,120 75,25 140,-50" fill="url(#primary-grad)" />

    <!-- Bottom Horizontal & Anchor Slice -->
    <path d="M -110 120 L 130 120 L 110 80 L -50 80 L -110 120 Z" fill="url(#primary-grad)" />

    <!-- Futuristic Cyan Accent Node -->
    <polygon points="130,-120 155,-95 130,-70 105,-95" fill="url(#accent-grad)" />
    <polygon points="-130,120 -155,95 -130,70 -105,95" fill="url(#accent-grad)" />
  </g>

  <!-- Outer Tech Accents -->
  <circle cx="256" cy="70" r="4" fill="#06B6D4" opacity="0.8" />
  <circle cx="256" cy="442" r="4" fill="#8B5CF6" opacity="0.8" />
</svg>
