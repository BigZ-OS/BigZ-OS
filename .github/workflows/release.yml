name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject Windows media and test artifacts
        shell: pwsh
        run: ./infra/ci/Test-BigZSourceTree.ps1
      - name: Package source
        shell: bash
        run: |
          git archive --format=zip --output=BigZ-OS-source.zip "${GITHUB_REF_NAME}"
          sha256sum BigZ-OS-source.zip > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: BigZ-OS-source.zip
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BigZ-OS-source.zip SHA256SUMS --generate-notes
