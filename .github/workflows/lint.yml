name: Lint and validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.ps1,*.psm1,*.psd1 | Where-Object { $_.FullName -notmatch '[\\/]builder_refs?[\\/]' }
          if ($files) { $issues = Invoke-ScriptAnalyzer -Path $files.FullName -Severity Error,Warning; $issues | Format-Table; if ($issues) { exit 1 } }
      - name: Validate JSON and Markdown
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Filter *.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null }
          Get-ChildItem -Recurse -File -Filter *.md | ForEach-Object { if ((Get-Content -Raw $_.FullName) -match '\x00') { throw "NUL byte in $($_.FullName)" } }
