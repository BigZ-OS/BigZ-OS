name: Lint and validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0 (Node 24)
      - name: Reject Windows media and test artifacts
        shell: pwsh
        run: ./infra/ci/Test-BigZSourceTree.ps1
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.ps1,*.psm1,*.psd1 | Where-Object { $_.FullName -notmatch '[\/]builder[\/]_refs[\/]' }
          $issues = @($files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning })
          $issues | Format-Table -AutoSize -Wrap ScriptName, Line, RuleName, Message
          if ($issues.Count -gt 0) { exit 1 }
      - name: Validate JSON and Markdown
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Filter *.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null }
          Get-ChildItem -Recurse -File -Filter *.md | ForEach-Object { if ((Get-Content -Raw $_.FullName) -match '\x00') { throw "NUL byte in $($_.FullName)" } }
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0 (Node 24)
      - name: Install Pester 5.7.1
        shell: powershell
        run: Install-Module Pester -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.7.1 -MaximumVersion 5.7.1 -Force
      - name: Run unit and integration tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = @('tests/unit', 'tests/integration')
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'TestResults-Pester.xml'
          Invoke-Pester -Configuration $config
      - name: Upload NUnit results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: pester-nunit-results
          path: TestResults-Pester.xml
          if-no-files-found: warn


