name: Feature request
description: Suggest a project improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: checkboxes
    id: safety
    attributes:
      label: Project constraints
      options:
        - {label: This does not propose redistributing Windows binaries, bypassing licensing, or disabling protected security features., required: true}
